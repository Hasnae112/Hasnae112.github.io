var U={en:{about:"About",projects:"Projects",experience:"Experience",education:"Education",skills:"Skills",contact:"Contact",theme:"Theme",pill:"Seeking a PFE in AI · from February 2027",role:"Digital Transformation & AI Engineering Student",lead:"Exploring the intersection of AI, data, and engineering to build intelligent solutions that make a real-world impact. I’m passionate about developing machine learning systems, exploring language models, and transforming complex data into meaningful insights.",view:"View projects",cv:"Download CV",morocco:"Morocco",c1:"Engineering student · ENSAH",c2:"NLP & information retrieval",c3:"RAG & machine learning",c4:"Data engineering",aEb:"Profile",aH:"About me",a2:"I'm an engineering student specializing in Artificial Intelligence and Digital Transformation at ENSA Al Hoceima, driven by a curiosity for how intelligent systems work and how they can solve real-world problems.<br><br>My work spans Machine Learning, Deep Learning, NLP, LLMs, and Data Engineering, with a focus on building solutions that go beyond experimentation. From developing hybrid information-retrieval pipelines for candidate–job matching to exploring RAG-based conversational systems and data workflows, I enjoy bringing different technologies together to build systems that are practical, measurable, and reliable.<br><br>I believe good engineering is about more than making something work—it's about understanding the problem, making thoughtful technical decisions, and continuously improving the result. I'm particularly interested in the intersection of AI, data, and software engineering, where intelligent models meet the infrastructure and workflows needed to make them useful.",a3:"Currently seeking a final-year engineering internship (PFE) starting February 2027, I'm eager to contribute to challenging projects, learn from experienced engineers, and turn ambitious ideas into meaningful technology.",exEb:"Career",exH:"Professional experience",more:"Read more →",edEb:"Studies",edH:"Education",edW:"2022 — PRESENT",edT:"Engineering Degree in AI & Digital Transformation",edO:"ENSAH · École Nationale des Sciences Appliquées d’Al Hoceïma",ed1:"Preceded by an integrated preparatory cycle.",ed2:"Key courses: Cloud Computing, Machine Learning, Deep Learning, NLP, Cybersecurity, DevOps, Data Engineering, Software Engineering.",skEb:"Toolbox",skH:"Skills",langs:"Languages: Arabic (native) · French (fluent) · English (fluent)",ctaH:"Let’s work together.",ctaP:"Looking for a PFE in AI starting February 2027. Happy to discuss opportunities or projects.",ctaB:"Get in touch",f1:"© 2026 Hasnae Elballaoui",f2:"Built with care · AI & Data Engineering",prEb:"Selected work",prH:"Projects",pr1:"NLP, machine learning, computer vision, data engineering and cloud. All code is on ",pr2:".",main:"Main projects",other:"Other projects",repo:"Repository",rep:"Project report (PDF)",ctx:"Context",tools:"Tools",back:"← Back",allp:"← All projects",expb:"← Experience",ov:"Overview",pb:"Problem and objective",ar:"Architecture",ta:"Technical approach",wd:"What I did",ep:"Evaluation protocol",re:"Results and evaluation",ch:"Challenges and decisions",fg:"Screenshots and figures",

fr:{about:"À propos",projects:"Projets",experience:"Expérience",education:"Formation",skills:"Compétences",contact:"Contact",theme:"Thème",pill:"À la recherche d’un PFE en IA · à partir de février 2027",role:"Élève-ingénieure en Transformation Digitale et Intelligence Artificielle",lead:"J’explore le croisement de l’IA, des données et de l’ingénierie pour concevoir des solutions intelligentes qui ont un impact concret. Je suis passionnée par le développement de systèmes de machine learning, l’exploration des modèles de langage et la transformation de données complexes en informations utiles.",view:"Voir les projets",cv:"Télécharger le CV",morocco:"Maroc",c1:"Élève-ingénieure · ENSAH",c2:"NLP et recherche d’information",c3:"RAG et machine learning",c4:"Ingénierie des données",aEb:"Profil",aH:"À propos",a2:"Je suis élève-ingénieure à l’ENSA Al Hoceima, spécialisée en intelligence artificielle et en transformation digitale. Je suis curieuse de comprendre le fonctionnement des systèmes intelligents et leur capacité à répondre à des problèmes concrets.<br><br>Mes travaux couvrent le Machine Learning, le Deep Learning, le NLP, les LLM et l’ingénierie des données. Je m’attache à créer des solutions qui dépassent l’expérimentation : des pipelines hybrides de recherche d’information pour le matching entre candidats et offres d’emploi, des systèmes conversationnels fondés sur le RAG et des workflows de données. J’aime combiner différentes technologies pour construire des systèmes pratiques, mesurables et fiables.<br><br>Pour moi, bien concevoir un système ne consiste pas seulement à le faire fonctionner. Il faut comprendre le problème, prendre des décisions techniques réfléchies et améliorer continuellement le résultat. Je m’intéresse particulièrement au croisement de l’IA, des données et du génie logiciel, où les modèles intelligents rencontrent l’infrastructure et les workflows qui les rendent utiles.",a3:"Je recherche actuellement un stage de fin d’études (PFE) à partir de février 2027. Je souhaite contribuer à des projets ambitieux, apprendre auprès d’ingénieurs expérimentés et transformer des idées en technologies utiles.",exEb:"Parcours",exH:"Expérience professionnelle",more:"En savoir plus →",edEb:"Études",edH:"Formation",edW:"2022 — AUJOURD’HUI",edT:"Cycle ingénieur en IA et Transformation Digitale",edO:"ENSAH · École Nationale des Sciences Appliquées d’Al Hoceïma",ed1:"Précédé d’un cycle préparatoire intégré.",ed2:"Cours principaux : Cloud Computing, Machine Learning, Deep Learning, NLP, Cybersécurité, DevOps, Ingénierie des Données, Génie Logiciel.",skEb:"Boîte à outils",skH:"Compétences",langs:"Langues : arabe (langue maternelle) · français (courant) · anglais (courant)",ctaH:"Travaillons ensemble.",ctaP:"À la recherche d’un PFE en IA à partir de février 2027. Ouverte à toute opportunité ou discussion autour d’un projet.",ctaB:"Me contacter",f1:"© 2026 Hasnae Elballaoui",f2:"Conçu avec soin · IA et ingénierie des données",prEb:"Sélection",prH:"Projets",pr1:"NLP, machine learning, vision par ordinateur, ingénierie des données et cloud. Tout le code est sur ",pr2:".",main:"Projets principaux",other:"Autres projets",repo:"Dépôt",rep:"Rapport du projet (PDF)",ctx:"Contexte",tools:"Outils",back:"← Retour",allp:"← Tous les projets",expb:"← Expérience",ov:"Présentation",pb:"Problème et objectif",ar:"Architecture",ta:"Approche technique",wd:"Ce que j’ai fait",ep:"Protocole d’évaluation",re:"Résultats et évaluation",ch:"Défis et décisions",fg:"Captures et figures",

"software-engineering-chatbot":{t:"Chatbot en Génie Logiciel",k:"NLP · Étude comparative",ctx:"Projet académique · Deep learning",s:"Trois chatbots comparés sur des questions de génie logiciel (Seq2Seq, FLAN-T5 fine-tuné, RAG hybride) ; RAG retenue pour sa robustesse et son ancrage dans les sources.",
 ov:"Étude comparative de trois chatbots de deep learning pour des questions de génie logiciel, construits et évalués sur la même tâche : un modèle Seq2Seq avec attention entraîné from scratch, un FLAN-T5 fine-tuné et un pipeline hybride de génération augmentée par la recherche (RAG). Le travail est rédigé sous forme d’article court dans le dépôt.",
 prob:"Un chatbot généraliste échoue souvent sur des questions spécialisées et peut produire des réponses fluides mais non fondées. Les travaux existants évaluent en général une seule approche sur un benchmark générique ; ici, trois approches sont comparées sur le même domaine, avec un protocole d’évaluation cohérent.",
 arch:[["Question","Une question de génie logiciel entre dans chacun des trois systèmes."],["Seq2Seq + attention","Encodeur LSTM bidirectionnel, attention de Bahdanau et décodeur LSTM, entraînés from scratch avec TensorFlow / Keras sur environ 12 700 exemples."],["FLAN-T5 fine-tuné","FLAN-T5-base fine-tuné sur un corpus curé de 655 paires question–réponse, avec récupération FAISS et re-ranking à l’inférence."],["RAG hybride","Recherche dense (multilingual-e5-large et FAISS) combinée à BM25, re-ranking par Cross-Encoder, puis générateur FLAN-T5 adapté par LoRA."],["Évaluation","BLEU pour le modèle from scratch ; Accuracy@K, MRR, ROUGE et similarité sémantique pour les deux autres."]],
 n:"Les étapes 2 à 4 sont des architectures alternatives comparées sur la même tâche, et non des étapes consécutives.",
 b:["Construction des trois pipelines sur Kaggle avec un GPU Tesla T4, chacun avec son propre jeu de données et son prétraitement.","Score de récupération hybride mélangeant les scores dense et BM25 normalisés, suivi d’un re-ranking par Cross-Encoder.","Le fine-tuning LoRA n’entraîne que 0,71 % des paramètres du modèle.","Interface Gradio bilingue grâce à la détection de langue et à la traduction."],
 mt:[["0,0003","BLEU, Seq2Seq from scratch"],["0,67","ROUGE-L, RAG"],["0,94","similarité sémantique, RAG"],["0,71 %","paramètres entraînés (LoRA)"]],
 tb:{h:["Approche","Données d’entraînement","Résultat","Risque d’hallucination","Verdict"],r:[["Seq2Seq from scratch","12 693 exemples","BLEU 0,0003, réponses incohérentes","Élevé","Baseline pédagogique"],["FLAN-T5 fine-tuné","655 Q&R curées","ROUGE-L 1,00 en validation","Moyen à élevé sur des questions inédites","Intermédiaire"],["RAG hybride","809 Q&R augmentées","ROUGE-L 0,67, similarité 0,94, Accuracy@K et MRR de 1,0 en récupération (81 exemples de validation)","Faible, réponses ancrées dans le texte récupéré","Retenue"]]},
 r:["La RAG a été retenue pour sa robustesse, sa contextualisation et ses hallucinations réduites, et non pour le meilleur score ROUGE.","Les scores parfaits du modèle fine-tuné en validation reflètent très probablement un recouvrement entre validation et entraînement ; ils ne prouvent pas la généralisation.","La RAG sacrifie un peu de recouvrement lexical pour des réponses naturelles et ancrées, tout en conservant le sens (similarité sémantique 0,94)."]},

"pfa-3d-smart-factory":{t:"Stagiaire PFA, NLP / IA",o:"3D Smart Factory · Mohammedia, à distance",w:"JUIL. — SEPT. 2026",k:"Stage · NLP / IA",ctx:"PFA · À distance · 15 juil. – 1er sept. 2026",
 s:"Pipeline hybride et personnalisé de matching CV–offre : NDCG@5 de 0,900 contre 0,849 pour BM25 et 0,790 pour l’aléatoire, sur 341 CV évalués.",
 ov:"Mon projet de fin d’année (PFA) chez 3D Smart Factory, réalisé à distance au sein d’une cohorte de stagiaires, chacun responsable d’un sujet distinct, avec un point d’avancement hebdomadaire le lundi. Le sujet : un pipeline hybride profond et personnalisé qui classe les offres d’emploi pour le CV d’un candidat.",
 prob:"La recherche lexicale peine quand un CV et une offre décrivent la même réalité avec un vocabulaire différent. La question : comment construire un pipeline de matching qui améliore mesurablement le classement par rapport à une baseline lexicale, tout en restant compatible avec une mise à l’échelle ultérieure, et en documentant honnêtement les choix sans gain.",
 arch:[["Ingestion CV / offres","CV en PDF ou DOCX ; offres collectées via les API Remotive et France Travail (498 offres dans le catalogue de démonstration)."],["Prétraitement NLP","Nettoyage et extraction à base de règles des compétences, de l’expérience, de la formation, des langues, de la localisation, du type de contrat et du mode de travail."],["Embeddings","Embeddings de phrases all-MiniLM-L6-v2 (384 dimensions)."],["Recherche FAISS","Recherche exacte IndexFlatIP renvoyant les Top-N offres."],["Re-ranking Cross-Encoder","cross-encoder/stsb-roberta-base sur des paires (offre, CV)."],["Scoring orienté compétences","Combine le rang du Cross-Encoder et le recouvrement de Jaccard des compétences détectées (α = 0,4)."],["Personnalisation","Reclasse selon la localisation, le contrat, le mode de travail, la séniorité et les compétences prioritaires (β = 0,5, hyperparamètre de démonstration)."],["Top-5 dans Streamlit","Offres classées avec compétences détectées et compatibilité aux préférences."]],
 n:"Airflow (DAG pfa_pipeline_refresh, quotidien, sous Docker) orchestre la construction du dataset, le prétraitement, les embeddings et l’évaluation jusqu’au Cross-Encoder. Le scoring orienté compétences et la personnalisation s’exécutent via leurs scripts de démonstration.",
 b:["Conception de l’architecture modulaire en cascade, implémentation et évaluation de chaque composant indépendamment par rapport à des baselines.","Réalisation de la chaîne d’ingestion et de prétraitement, de l’application Streamlit et de la collecte d’offres via API.","Rédaction de tests unitaires pour l’extraction des compétences, de la localisation et du mode de travail, dont un test de non-régression pour un bug « java » dans « javascript ».","Documentation honnête des approches explorées mais non retenues."],
 ev:["Resume Dataset (Kaggle) : 344 CV, 28 offres et 9 544 paires annotées avec un score de correspondance continu.","Precision@5, Recall@5 et MRR utilisent un seuil de pertinence de 0,7 ; NDCG@5 utilise le score gradué. 341 CV sont évalués ; 3 sont exclus car aucune offre n’atteint le seuil."],
 mt:[["0,900","NDCG@5, pipeline de production"],["0,849","NDCG@5, BM25"],["0,790","NDCG@5, aléatoire"],["341 / 28","CV évalués / offres"]],
 tb:{h:["Configuration","P@5","R@5","MRR","NDCG@5"],r:[["Aléatoire (30 tirages)","0,471","0,181","0,635","0,790"],["BM25","0,626","0,269","0,687","0,849"],["Compétences seules (Jaccard)","0,681","0,288","0,849","0,888"],["Embeddings","0,679","0,282","0,826","0,886"],["+ Cross-Encoder","0,703","0,297","0,832","0,894"],["+ Scoring orienté compétences (α = 0,4, production)","0,723","0,314","0,843","0,900"]]},
 r:["Chaque étape retenue améliore les quatre métriques par rapport à la précédente.","Les écarts sont étroits car 46,8 % des paires sont pertinentes : même un classement aléatoire obtient 0,790. Les résultats se lisent par rapport aux baselines aléatoire et BM25.","Un classement par compétences seules obtient un score proche des embeddings (0,888), ce qui justifie de combiner les deux signaux.","α a été choisi par grid search sur les mêmes 341 CV ; il maximise Precision@5 et Recall@5."],
 ch:["Un premier Cross-Encoder (ms-marco-MiniLM) dégradait le classement par rapport aux embeddings seuls. Après avoir écarté la troncature du texte et l’usage du score, j’ai trouvé la cause : ms-marco est entraîné pour des requêtes courtes face à de longs passages, alors qu’un CV et une offre sont deux textes de nature comparable.","Utiliser stsb-roberta-base avec la paire ordonnée (offre, CV) a corrigé le problème : 205 CV améliorés contre 130 dégradés, la meilleure distribution parmi les configurations testées.","Deux idées ont été testées puis abandonnées : la fusion BM25 et embeddings n’apportait aucun gain quel que soit le poids, et MaxSim (de type ColBERT) améliorait le Recall@15 (0,691 à 0,731) sans changer le NDCG@5 (0,894) une fois le Cross-Encoder ajouté."],
 fg:[["ui","Application Streamlit : import du CV et préférences."],["rank","Classement personnalisé avec rang de matching et compatibilité aux préférences."],["alpha","Scoring orienté compétences sur toute la grille de α (α = 0,4 en production)."],["dag","DAG Airflow pfa_pipeline_refresh."]]},
